<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Decorative circles -->
  <circle cx="900" cy="150" r="200" fill="#3b82f6" opacity="0.1"/>
  <circle cx="300" cy="450" r="150" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">Aaban Rehman</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="40" fill="#94a3b8" text-anchor="middle">Full-Stack ASP.NET Core Developer</text>
  <text x="600" y="420" font-family="monospace" font-size="30" fill="#3b82f6" text-anchor="middle">Microsoft Certified | Azure | Blazor</text>
  
  <!-- Logo badge at bottom -->
  <circle cx="600" cy="540" r="50" fill="#3b82f6" opacity="0.2"/>
  <text x="600" y="565" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">AR</text>
</svg>
